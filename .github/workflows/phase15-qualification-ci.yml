name: Phase 15 Qualification Integration CI

on:
  push:
    branches:
      - phase15/qualification-graph-methodology
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest jsonschema
      - name: Run complete GACM regression
        env:
          PYTHONPATH: src
        run: python -m pytest -q
