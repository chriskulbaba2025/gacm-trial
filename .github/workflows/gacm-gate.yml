name: GACM Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gacm-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
      - name: Install pinned CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Run tranche gate
        env:
          PYTHONPATH: src
        run: python -m gacm check --tranche-from-head --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --out gate-verdict.json
